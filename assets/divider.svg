<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="katana divider">
<defs><style>
    .pf { transform-box: fill-box; }
    @keyframes fallA { from { transform: translate(0,-40px); } to { transform: translate(-260px, 110px); } }
    @keyframes fallB { from { transform: translate(0,-40px); } to { transform: translate(-140px, 110px); } }
    @keyframes fallC { from { transform: translate(0,-40px); } to { transform: translate(-360px, 110px); } }
    @keyframes snow  { from { transform: translate(0,-20px); } to { transform: translate(-60px, 110px); } }
    @keyframes sway  { 0%,100% { transform: translateX(-10px); } 50% { transform: translateX(12px); } }
    @keyframes tumble{ 0% { transform: rotate(0) scaleX(1); } 50% { transform: rotate(200deg) scaleX(-.4); } 100% { transform: rotate(360deg) scaleX(1); } }
    .tb { transform-box: fill-box; transform-origin: center; }

 .gl { animation: gl 4.5s ease-in-out infinite; } @keyframes gl { 0% { transform: translateX(0); } 70%,100% { transform: translateX(880px); } }
 @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
